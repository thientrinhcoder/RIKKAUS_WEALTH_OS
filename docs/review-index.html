<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rikkaus Wealth OS | Bảng điều hướng review</title>
  <meta name="theme-color" content="#0A2240">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--canvas:#F6F4EF;--surface:#fff;--subtle:#F1EEE7;--ink:#121A26;--muted:#5A6472;--border:#DDD8CD;--control:#8C909A;--navy:#0A2240;--primary:#0F2E57;--pressed:#0A2240;--primary-soft:#E8EDF4;--gold:#8A6A3F;--success:#15803D;--font:"Inter","Segoe UI",system-ui,sans-serif;--display:"Source Serif 4","Source Serif Pro",Georgia,serif;--s1:.25rem;--s2:.5rem;--s3:.75rem;--s4:1rem;--s6:1.5rem;--r-input:2px;--r-card:2px;--line:1px solid var(--border);--motion:200ms;--ease:cubic-bezier(.25,1,.5,1)}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:grid;grid-template-columns:19rem minmax(0,1fr);background:var(--canvas);color:var(--ink);font:400 1rem/1.5 var(--font)}
  a{color:var(--primary)}
  button{font:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--primary);outline-offset:2px}

  /* ---- sidebar ---- */
  .sidebar{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;min-height:0;border-right:var(--line);background:var(--surface)}
  .brand{padding:var(--s4);border-bottom:2px solid var(--gold)}
  .brand strong{display:block;font:600 1.25rem/1.2 var(--display);color:var(--navy)}
  .brand span{color:var(--muted);font-size:.8125rem}
  .search{padding:var(--s3) var(--s4);border-bottom:var(--line)}
  .search input{width:100%;min-height:40px;padding:var(--s2) var(--s3);border:1px solid var(--control);border-radius:var(--r-input);font:inherit;background:var(--canvas)}
  .nav{overflow-y:auto;padding:var(--s3) 0}
  .group{border:0;margin:0;padding:0}
  .group-head{display:flex;align-items:center;gap:var(--s2);width:100%;padding:var(--s2) var(--s4);border:0;background:none;color:var(--muted);font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .group-head .count{margin-left:auto;font-weight:400;letter-spacing:0;text-transform:none}
  .group-head .caret{transition:transform var(--motion) var(--ease)}
  .group[data-open="false"] .caret{transform:rotate(-90deg)}
  .group[data-open="false"] .items{display:none}
  .items{list-style:none;margin:0 0 var(--s3);padding:0}
  .items a{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s2);align-items:baseline;padding:var(--s2) var(--s4) var(--s2) var(--s6);color:var(--ink);text-decoration:none;font-size:.875rem;border-left:3px solid transparent}
  .items a:hover{background:var(--subtle)}
  .items a[aria-current="page"]{background:var(--primary-soft);border-left-color:var(--primary);color:var(--primary);font-weight:600}
  .items a .num{color:var(--gold);font-variant-numeric:tabular-nums;font-size:.75rem;font-weight:700}
  .items a.done .label::after{content:" ✓";color:var(--success);font-weight:700}
  .items li.hide{display:none}
  .side-foot{padding:var(--s3) var(--s4);border-top:var(--line);color:var(--muted);font-size:.75rem}
  .side-foot kbd{padding:0 .3em;border:var(--line);border-radius:4px;background:var(--canvas);font:inherit;font-size:.9em}

  /* ---- main ---- */
  .main{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
  .bar{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s4);border-bottom:var(--line);background:var(--surface)}
  .bar h1{margin:0;font:600 1rem/1.3 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .spacer{margin-left:auto}
  .bar button,.bar a.btn{min-height:36px;padding:var(--s1) var(--s3);border:1px solid var(--control);border-radius:var(--r-input);background:var(--surface);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;font-size:.875rem}
  .bar button:hover,.bar a.btn:hover{background:var(--subtle)}
  .bar .mark[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:600}
  iframe{width:100%;height:100%;border:0;background:var(--canvas)}
  .welcome{display:grid;place-content:center;gap:var(--s3);padding:var(--s6);text-align:center;color:var(--muted)}
  .welcome h2{margin:0;font:600 1.75rem/1.2 var(--display);color:var(--navy)}

  @media(max-width:860px){
    body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
    .sidebar{grid-template-rows:auto auto auto auto;max-height:45vh}
  }

  /* ===== Private banking layer ===== */
  body{-webkit-font-smoothing:antialiased}
  .sidebar{background:#0A2240;color:#FFFFFF;border-right:2px solid #C9A66B}
  .brand{border-bottom:1px solid rgba(255,255,255,.14)}
  .brand strong{font:500 1.0625rem/1.2 var(--display);letter-spacing:.2em;text-transform:uppercase;color:#FFFFFF}
  .brand span{color:#C9A66B;font-size:.6875rem;letter-spacing:.12em;text-transform:uppercase}
  .search input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);border-radius:0;color:#FFFFFF}
  .search input::placeholder{color:rgba(255,255,255,.55)}
  .group-head{color:#C9A66B;font-size:.6875rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;border-radius:0;background:transparent}
  .group-head .count{color:rgba(255,255,255,.55)}
  .group-head .caret{color:#C9A66B}
  .items a{color:rgba(255,255,255,.82);border-radius:0}
  .items a .num{color:#C9A66B;font-family:var(--display)}
  .items a:hover{background:rgba(255,255,255,.06);color:#FFFFFF}
  .items a[aria-current="page"]{background:rgba(255,255,255,.08);color:#FFFFFF;box-shadow:inset 3px 0 0 #C9A66B}
  .items a.done .label::after{color:#9FD0B1}
  .side-foot{color:rgba(255,255,255,.55);border-top:1px solid rgba(255,255,255,.14)}
  .side-foot kbd{background:transparent;border:1px solid rgba(255,255,255,.3);color:#FFFFFF;border-radius:0}
  .bar{background:#FFFFFF;border-bottom:1px solid #121A26}
  .bar h1{font:400 1.125rem/1.3 var(--display);color:#0A2240}
  .bar button,.bar a.btn{border-radius:2px;border-color:#0F2E57;color:#0F2E57;font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  .bar button:hover,.bar a.btn:hover{background:#E8EDF4}
  .bar .mark[aria-pressed="true"]{background:#15803D;border-color:#15803D;color:#FFFFFF}
  .welcome h2{font:300 2rem/1.2 var(--display);color:#0A2240}
</style>
</head>
<body>

<nav class="sidebar" aria-label="Danh sách review">
  <div class="brand">
    <strong>Rikkaus Wealth OS</strong>
    <span>18 bản review thiết kế · 3 nhóm</span>
  </div>

  <div class="search">
    <input id="q" type="search" placeholder="Lọc theo tên màn hình…" aria-label="Lọc review">
  </div>

  <div class="nav" id="nav"></div>

  <div class="side-foot">
    <kbd>J</kbd>/<kbd>K</kbd> chuyển bản · <kbd>M</kbd> đánh dấu đã duyệt
  </div>
</nav>

<div class="main">
  <header class="bar">
    <button id="prev" title="Bản trước (K)">←</button>
    <button id="next" title="Bản sau (J)">→</button>
    <h1 id="title">Chọn một bản review</h1>
    <span class="spacer"></span>
    <button class="mark" id="mark" aria-pressed="false">Đã duyệt</button>
    <a class="btn" id="open" href="#" target="_blank" rel="noopener">Mở tab mới</a>
  </header>
  <div id="stage">
    <div class="welcome">
      <h2>Bảng điều hướng review</h2>
      <p>Chọn một bản ở cột trái. Trạng thái “đã duyệt” được lưu trên trình duyệt này.</p>
    </div>
  </div>
</div>

<script>
const GROUPS = [
  { id:"g1", title:"Nhóm 1 · Nền tảng & Tài sản", items:[
    { f:"design-system-responsive-shell-review.html",        t:"Design system & responsive shell" },
    { f:"identity-session-ownership-review.html",            t:"Định danh, phiên & quyền sở hữu" },
    { f:"money-currency-time-primitives-review.html",        t:"Nguyên thủy tiền, tiền tệ & thời gian" },
    { f:"personal-profile-exchange-rate-settings-review.html",t:"Hồ sơ cá nhân & tỷ giá USD/VND" },
    { f:"asset-catalog-common-crud-review.html",             t:"Danh mục tài sản (CRUD chung)" },
    { f:"type-specific-asset-details-review.html",           t:"Chi tiết tài sản theo loại" },
  ]},
  { id:"g2", title:"Nhóm 2 · Định giá, Nợ & Dòng tiền", items:[
    { f:"asset-valuation-history-review.html",               t:"Lịch sử định giá tài sản" },
    { f:"liability-catalog-schedules-collateral-review.html",t:"Danh mục nợ, lịch trả & tài sản đảm bảo" },
    { f:"cash-flow-entry-catalog-crud-review.html",          t:"Danh mục dòng tiền (CRUD)" },
    { f:"recurring-cash-flow-schedule-expansion-review.html",t:"Dòng tiền định kỳ & khai triển lịch" },
    { f:"monthly-cash-flow-reports-composition-review.html", t:"Báo cáo dòng tiền theo tháng" },
    { f:"three-month-cash-flow-forecast-review.html",        t:"Dự báo dòng tiền 3 tháng" },
  ]},
  { id:"g3", title:"Nhóm 3 · Dashboard, Chỉ số & Mục tiêu", items:[
    { f:"wealth-snapshot-dashboard-review.html",             t:"Wealth snapshot dashboard" },
    { f:"explainable-wealth-snapshot-insights-review.html",  t:"Nhận định snapshot có thể giải thích" },
    { f:"financial-health-indicators-insights-review.html",  t:"Chỉ số sức khỏe tài chính" },
    { f:"generic-financial-goals-templates-review.html",     t:"Mục tiêu tài chính & template" },
    { f:"transparent-goal-projection-status-review.html",    t:"Dự phóng & trạng thái mục tiêu" },
    { f:"basic-advisor-rule-based-report-review.html",       t:"Báo cáo advisor theo luật" },
  ]},
];

const FLAT = GROUPS.flatMap(g => g.items);
const KEY = "rikkaus-review-done";

const store = {
  read(){ try { return new Set(JSON.parse(localStorage.getItem(KEY)) || []); } catch { return new Set(); } },
  write(set){ try { localStorage.setItem(KEY, JSON.stringify([...set])); } catch {} },
};
let done = store.read();

const nav = document.getElementById("nav");
let n = 0;
for (const g of GROUPS) {
  const sec = document.createElement("section");
  sec.className = "group";
  sec.dataset.open = "true";
  const head = document.createElement("button");
  head.className = "group-head";
  head.innerHTML = `<span class="caret">▾</span><span>${g.title}</span><span class="count">${g.items.length}</span>`;
  head.addEventListener("click", () => {
    sec.dataset.open = sec.dataset.open === "true" ? "false" : "true";
    head.setAttribute("aria-expanded", sec.dataset.open);
  });
  head.setAttribute("aria-expanded", "true");
  const ul = document.createElement("ul");
  ul.className = "items";
  for (const it of g.items) {
    const i = n++;
    const li = document.createElement("li");
    li.innerHTML = `<a href="#${it.f}" data-i="${i}"><span class="num">${String(i+1).padStart(2,"0")}</span><span class="label">${it.t}</span></a>`;
    ul.appendChild(li);
  }
  sec.append(head, ul);
  nav.appendChild(sec);
}

const links = [...nav.querySelectorAll("a")];
const stage = document.getElementById("stage");
const titleEl = document.getElementById("title");
const markBtn = document.getElementById("mark");
const openBtn = document.getElementById("open");
let current = -1;

function paintDone(){
  links.forEach((a,i) => a.classList.toggle("done", done.has(FLAT[i].f)));
  if (current >= 0) markBtn.setAttribute("aria-pressed", String(done.has(FLAT[current].f)));
}

function show(i, push){
  if (i < 0 || i >= FLAT.length) return;
  current = i;
  const item = FLAT[i];
  stage.innerHTML = "";
  const frame = document.createElement("iframe");
  frame.src = item.f;
  frame.title = item.t;
  stage.appendChild(frame);
  titleEl.textContent = `${String(i+1).padStart(2,"0")} · ${item.t}`;
  openBtn.href = item.f;
  links.forEach((a,k) => k === i ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  links[i].scrollIntoView({ block:"nearest" });
  if (push !== false) history.replaceState(null, "", "#" + item.f);
  paintDone();
}

nav.addEventListener("click", e => {
  const a = e.target.closest("a"); if (!a) return;
  e.preventDefault();
  show(Number(a.dataset.i));
});

document.getElementById("prev").addEventListener("click", () => show(current <= 0 ? FLAT.length-1 : current-1));
document.getElementById("next").addEventListener("click", () => show(current >= FLAT.length-1 ? 0 : current+1));

markBtn.addEventListener("click", () => {
  if (current < 0) return;
  const f = FLAT[current].f;
  done.has(f) ? done.delete(f) : done.add(f);
  store.write(done);
  paintDone();
});

document.getElementById("q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  links.forEach((a,i) => {
    a.parentElement.classList.toggle("hide", q !== "" && !FLAT[i].t.toLowerCase().includes(q));
  });
});

document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "j") { e.preventDefault(); show(current >= FLAT.length-1 ? 0 : current+1); }
  if (k === "k") { e.preventDefault(); show(current <= 0 ? FLAT.length-1 : current-1); }
  if (k === "m") { e.preventDefault(); markBtn.click(); }
});

const start = FLAT.findIndex(x => x.f === decodeURIComponent(location.hash.slice(1)));
if (start >= 0) show(start, false); else paintDone();
</script>
</body>
</html>
