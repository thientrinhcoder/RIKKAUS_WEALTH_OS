# Local development profile. Activate with --spring.profiles.active=local.
#
# Everything under `rikkaus` is one mapping. It was previously written as two separate `rikkaus:`
# blocks, which SnakeYAML refuses outright as a duplicate key, so the profile aborted before the
# application context was built and the profile could never start at all. Keep each top-level key
# declared once in this file.
rikkaus:
  api:
    # The base configuration permits no origin at all, so cross-origin development needs this profile
    # or an explicit API_ALLOWED_ORIGINS value. The origin below was read from a running
    # `npx expo start --web`, which reported "Waiting on http://localhost:8081", rather than assumed
    # from Expo's documented default; apps/mobile pins no port in its web script.
    allowed-origins: http://localhost:8081
  auth:
    jwt:
      # A fixed development signing secret. Local-only, and it is committed on purpose so a new
      # developer can run the API without inventing one — exactly the same reasoning as the committed
      # PostgreSQL password in docker-compose.yml. Any deployed environment supplies RIKKAUS_JWT_SECRET
      # instead, and the base configuration has no default, so this value cannot leak into one by
      # being forgotten.
      secret: local-development-only-jwt-signing-secret
    google:
      # Supply a real client id from Google Cloud Console to sign in locally. The redirect URI below is
      # the one Expo web serves on; register the same value in the Google OAuth client or Google will
      # reject the exchange.
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
      redirect-uris: ${GOOGLE_OAUTH_REDIRECT_URIS:http://localhost:8081/auth/callback}

# The contract endpoint and Swagger UI are a developer convenience, enabled here only. Shipping them
# elsewhere would advertise every route to anonymous callers.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
