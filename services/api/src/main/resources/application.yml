spring:
  application:
    name: rikkaus-wealth-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rikkaus}
    username: ${POSTGRES_USER:rikkaus}
    password: ${POSTGRES_PASSWORD:rikkaus-local-only}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
