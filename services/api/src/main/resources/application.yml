spring:
  application:
    name: rikkaus-wealth-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rikkaus}
    username: ${POSTGRES_USER:rikkaus}
    password: ${POSTGRES_PASSWORD:rikkaus-local-only}
    hikari:
      data-source-properties:
        # PgJDBC appends the server's DETAIL and WHERE text to every exception message by default, and
        # for a constraint violation that text is "Failing row contains (...)" -- the whole row,
        # amounts and asset names included. Turning it off keeps row values out of every exception
        # message, and therefore out of any log line or trace that prints one. The SQLSTATE and the
        # constraint name, which are what diagnosis needs, are still reported.
        logServerErrorDetail: false
  main:
    # The banner is written straight to stdout, outside Logback, and is not JSON. The local profile
    # turns it back on.
    banner-mode: off
  autoconfigure:
    exclude:
      # Boot's fallback in-memory user exists only when no UserDetailsService is defined, and it logs
      # its generated password at WARN on every start -- a credential in the log, which the logging
      # rules forbid. Nothing here authenticates with a username and password (Google OIDC and bearer
      # tokens only, httpBasic and formLogin are disabled), so the fallback user is dead weight.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: never
  jackson:
    datatype:
      datetime:
        # Set explicitly rather than relying on the default, so Instant fields serialize as ISO-8601
        # strings and never as epoch numbers; the frontend's runtime schema depends on the string
        # form. Jackson 3 moved WRITE_DATES_AS_TIMESTAMPS from SerializationFeature to
        # DateTimeFeature, so the Boot 3 key spring.jackson.serialization.write-dates-as-timestamps
        # no longer binds and fails context startup outright.
        write-dates-as-timestamps: false

springdoc:
  api-docs:
    # The contract endpoint itself is gated, not only the browsable UI. Leaving /v3/api-docs
    # anonymously readable would publish every route, every schema and the whole error taxonomy —
    # including the codes reserved for authentication — on a service that has no authentication yet.
    # The committed openapi.json is what siblings consume, so nothing needs the live endpoint outside
    # local development and the build.
    enabled: false
    path: /v3/api-docs
  # Keeps /actuator/** and any future version out of the v1 contract without annotating anything.
  paths-to-match: /api/v1/**
  swagger-ui:
    enabled: false
  show-actuator: false

# What a log line may contain is decided in shared/observability (RequestLogFields is the allowlist,
# LogRedaction the rules) and summarised in docs/backend-deployment.md. logback-spring.xml picks the
# format: this readable pattern for the local profile, JSON for every other profile.
logging:
  pattern:
    # The :-no-correlation-id default makes a missing identifier visible rather than rendering an
    # empty bracket, which distinguishes "outside a request" from "the filter did not run"; the userId
    # default does the same for "no authenticated user". %redactedMsg and %safeEx are registered in
    # logback-spring.xml: the message with credentials and emails masked, and exceptions printed
    # without their messages.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{correlationId:-no-correlation-id}] [%X{userId:-no-user}] %logger{40} - %redactedMsg%n%safeEx"
  structured:
    format:
      # Logstash layout: MDC entries (correlationId, userId) and key-value pairs (httpMethod,
      # httpRoute, httpStatus, durationMs) become top-level members, and an exception becomes a single
      # stack_trace member -- unlike ECS, which adds an error.message member carrying the exception's
      # own text.
      console: logstash
    json:
      stacktrace:
        printer: com.rikkaus.wealth.shared.observability.MessageFreeStackTracePrinter
      customizer: com.rikkaus.wealth.shared.observability.RedactingJsonMembersCustomizer

rikkaus:
  auth:
    jwt:
      # No default. The application must not start without a real signing secret: anyone who can guess
      # it mints a valid token for any user id, which defeats every other control in this slice at once.
      # SessionProperties rejects an absent or short value and names this property in the failure.
      secret: ${RIKKAUS_JWT_SECRET:}
      # Short on purpose. A leaked access token is only useful until it expires, and the rotating
      # refresh token is what keeps a real session alive, so shortening this costs a user nothing.
      access-token-ttl: PT15M
    # How long a signed-in device can renew without returning to Google. Bounded so an abandoned
    # device eventually stops being a live session on its own.
    refresh-token-ttl: P30D
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      # Optional. A public client using PKCE alone needs none, so an empty value is a valid
      # configuration rather than a missing one.
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
      # Fails closed: empty permits no redirect URI at all. The value is forwarded to Google, which
      # delivers the authorization code to whatever it names, so accepting an unregistered one is how
      # codes reach an attacker's endpoint. Comma-separated, compared exactly.
      redirect-uris: ${GOOGLE_OAUTH_REDIRECT_URIS:}
      token-uri: https://oauth2.googleapis.com/token
      jwks-uri: https://www.googleapis.com/oauth2/v3/certs
      # Google issues both forms, and a single-issuer validator would reject one of them.
      issuers:
        - https://accounts.google.com
        - accounts.google.com
  api:
    # Fails closed. An unset or empty value registers no CORS mapping at all rather than guessing
    # an origin, as an explicit environment-specific allowlist requires. Comma-separated.
    allowed-origins: ${API_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health
      cors:
        # Actuator endpoints are served by their own handler mapping, which a WebMvcConfigurer's
        # addCorsMappings never reaches, so the API's CORS configuration cannot cover them. This is
        # the supported mechanism. It reads the same allowlist so one variable drives both surfaces,
        # and Boot registers no actuator CORS configuration at all when the list is empty.
        allowed-origins: ${rikkaus.api.allowed-origins}
        # Narrower than the API surface on purpose: no custom request headers, no exposed headers.
        allowed-methods: GET
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
