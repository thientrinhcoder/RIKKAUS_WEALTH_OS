spring:
  application:
    name: rikkaus-wealth-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rikkaus}
    username: ${POSTGRES_USER:rikkaus}
    password: ${POSTGRES_PASSWORD:rikkaus-local-only}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: never
  jackson:
    datatype:
      datetime:
        # Set explicitly rather than relying on the default, so Instant fields serialize as ISO-8601
        # strings and never as epoch numbers; the frontend's runtime schema depends on the string
        # form. Jackson 3 moved WRITE_DATES_AS_TIMESTAMPS from SerializationFeature to
        # DateTimeFeature, so the Boot 3 key spring.jackson.serialization.write-dates-as-timestamps
        # no longer binds and fails context startup outright.
        write-dates-as-timestamps: false

rikkaus:
  api:
    # Fails closed. An unset or empty value registers no CORS mapping at all rather than guessing
    # an origin, as an explicit environment-specific allowlist requires. Comma-separated.
    allowed-origins: ${API_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health
      cors:
        # Actuator endpoints are served by their own handler mapping, which a WebMvcConfigurer's
        # addCorsMappings never reaches, so the API's CORS configuration cannot cover them. This is
        # the supported mechanism. It reads the same allowlist so one variable drives both surfaces,
        # and Boot registers no actuator CORS configuration at all when the list is empty.
        allowed-origins: ${rikkaus.api.allowed-origins}
        # Narrower than the API surface on purpose: no custom request headers, no exposed headers.
        allowed-methods: GET
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
