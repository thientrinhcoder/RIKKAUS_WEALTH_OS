# Triaged infrastructure findings.
#
# Every entry below is a decision, not a suppression. Each names what the check wants, why this
# environment does not do it, and what would change the answer. An entry with no statement should
# fail review.
#
# This file used to hold eleven entries. The App Runner and Neon rewrite deleted the VPC, the four
# subnets, the three security groups, the load balancer, the CloudFront distribution and the RDS
# instance, and with them twelve of the thirteen findings — not by exempting them but by removing
# the resources they were about. The cheaper architecture turned out to be the smaller one.
#
# `expiredAt` is set so the remaining decision is re-asked rather than quietly becoming permanent.

misconfigurations:
  - id: AWS-0033
    paths:
      - "registry.tf"
    statement: >-
      ECR repository encrypted with the AWS-managed key rather than a customer-managed one. A CMK
      adds key administration and a monthly charge, and what it would protect here is application
      image layers: they are built from a public base image and carry no secret, because every
      runtime secret is injected from Parameter Store when the instance starts and none is baked
      into a layer. On an environment chosen specifically for costing almost nothing, a standing
      key charge to encrypt public bytes is the wrong trade.
    expiredAt: 2027-04-01
